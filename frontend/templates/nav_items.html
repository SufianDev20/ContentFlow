{# Shared nav links for the sidebar and the mobile drawer. Needs active_page. #}
<div class="sidebar-section">
    <nav class="sidebar-nav" aria-label="Main">
        <a href="{% url 'dashboard' %}" class="sidebar-link {% if active_page == 'dashboard' %}active{% endif %}">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h11M4 19h6"/></svg>
            Create
        </a>
        <a href="{% url 'history' %}" class="sidebar-link {% if active_page == 'history' %}active{% endif %}">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
            History
        </a>
        <a href="{% url 'stats' %}" class="sidebar-link {% if active_page == 'stats' %}active{% endif %}">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
            Stats
        </a>
    </nav>
</div>
<div class="sidebar-footer">
    <button type="button" class="sidebar-link theme-toggle" aria-label="Switch between dark and light theme">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
        <span class="theme-toggle-label">Light theme</span>
    </button>
    <button type="button" class="sidebar-link settings-trigger">
        <span class="nav-avatar-preview">
            <span class="nav-avatar-initial">?</span>
            <img class="nav-avatar-img hidden" alt="Avatar">
        </span>
        Settings
    </button>
    <a href="{% url 'logout' %}" class="sidebar-link">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h5v16h-5M10 8l-4 4 4 4M6 12h9"/></svg>
        Logout
    </a>
</div>
